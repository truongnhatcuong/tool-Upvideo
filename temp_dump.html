             navigation. A sprite mounted inside it would unmount mid-session. <body> is the only
             true once-per-document location.

             reliably supported (Safari), so the symbols must be in this document, not a fetched file.

             khong doi mot token nao"). Inlining these as .tsx would file ~81 UC-TOKEN-001 BLOCK
             findings against a file whose colours are deliberately theme-invariant. Stated plainly:
             the uiux ratchet scans `git ls-files src` for .css/.ts/.tsx only, so app.html is NOT
             scanned. That is a consequence of this placement, not the reason for it.

         DO NOT EDIT THE MARKUP BELOW. It is canon placed verbatim (R-UC17). To change a symbol,
